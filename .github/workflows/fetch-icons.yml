# One-time copy of the item icons from the MapleStory Wiki into this repo, so the site doesn't load
# them from the wiki on every visit. Run it from the Actions tab: "Copy item icons" -> "Run workflow".
name: Copy item icons
on: workflow_dispatch
permissions:
  contents: write
jobs:
