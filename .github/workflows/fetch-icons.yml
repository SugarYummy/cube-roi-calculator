          base = "https://media.maplestorywiki.net/yetidb/Eqp_"
          ua = "cube-roi-calculator one-time icon copy (github.com/SugarYummy/cube-roi-calculator)"
          saved, missing = 0, []
          for n in names:
              out = os.path.join("icons", "Eqp_" + urllib.parse.unquote(n) + ".png")
              if os.path.exists(out):
                  continue
              try:
                  req = urllib.request.Request(base + n + ".png", headers={"User-Agent": ua})
                  with urllib.request.urlopen(req, timeout=30) as r:
                      data = r.read()
                  if not data.startswith(b"\x89PNG"):
                      raise ValueError("not a png")
                  open(out, "wb").write(data)
                  saved += 1
              except Exception as e:
                  missing.append(n + "  (" + str(e) + ")")
              time.sleep(0.3)
          open("icons/missing.txt", "w").write("\n".join(missing) + "\n")
          print(saved, "saved,", len(missing), "missing (see icons/missing.txt)")
          print("\n".join(missing[:10]))
          with open(os.environ.get("GITHUB_STEP_SUMMARY", os.devnull), "a") as f:
              f.write(f"**{saved} icons saved, {len(missing)} missing**\n")
          PY
      - name: Save them in the repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898732+github-actions[bot]@users.noreply.github.com"
          git add icons
          git commit -m "Copy item icons from MapleStory Wiki" || { echo "Nothing new"; exit 0; }
          # If you changed the repo while this was running, catch up first, then save
          for i in 1 2 3; do git pull --rebase && git push && exit 0; sleep 5; done
          exit 1
